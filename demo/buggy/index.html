<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Demo App — con bugs sembrados</title>
  <style>
    :root { --brand: #2563eb; }
    * { box-sizing: border-box; }
    body {
      font: 16px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f172a; color: #e2e8f0;
    }
    .card { background: #1e293b; padding: 28px; border-radius: 16px; width: 320px; box-shadow: 0 10px 40px #0006; }
    h1 { margin: 0 0 16px; font-size: 20px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
    #dashboard { display: none; }
    .spinner { display: none; margin: 16px auto 0; width: 28px; height: 28px; border: 3px solid #334155; border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div id="login-view">
      <h1>Iniciar sesión</h1>
      <!-- BUG (asset): imagen que no existe → 404 -->
      <img src="/logo-inexistente.png" alt="logo" width="1" height="1" />
      <form id="login-form">
        <label for="email">Correo</label>
        <input id="email" type="email" />
        <label for="password">Contraseña</label>
        <input id="password" type="password" />
        <button id="login" type="submit">Entrar</button>
      </form>
      <!-- BUG (timeout): este spinner arranca al hacer login y nunca se detiene -->
      <div class="spinner" id="spinner"></div>
    </div>
    <!-- BUG (functional): el dashboard nunca se muestra y no dice "Bienvenido" -->
    <div id="dashboard"></div>
  </div>
  <script>
    // BUG (console): error de consola al cargar
    console.error('No se pudo cargar la configuración remota (config.json)');

    // BUG (network): fetch a un endpoint inexistente → 404
    fetch('/api/config').catch(function () {});

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      // Muestra un spinner que nunca resuelve
      document.getElementById('spinner').style.display = 'block';
      // BUG (crash): referencia a una variable inexistente → excepción no capturada
      guardarSesion(usuarioQueNoExiste.token);
    });
  </script>
</body>
</html>
